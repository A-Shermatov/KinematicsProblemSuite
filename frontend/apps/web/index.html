<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Donish — задачи и олимпиады по физике и математике с автопроверкой ответов" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Donish — задачи и олимпиады</title>
    <script>
      // Применяем тему до отрисовки, чтобы не было вспышки светлой темы.
      (function () {
        try {
          var mode = localStorage.getItem("kps.theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
