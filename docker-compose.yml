# Запуск всего проекта: docker compose up --build
# Сайт: http://localhost:8080, админ-панель: http://localhost:8081 (вход — ADMIN_USERNAME/ADMIN_PASSWORD из .env).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinematics}
      POSTGRES_USER: ${POSTGRES_USER:-kinematics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinematics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kinematics}
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY в .env (минимум 32 символа)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        APP: web
        VITE_ADMIN_URL: ${ADMIN_PUBLIC_URL:-http://localhost:8081}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Админ-панель — отдельное приложение и отдельный порт/домен.
  admin:
    build:
      context: ./frontend
      args:
        APP: admin
        VITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "${ADMIN_HTTP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
